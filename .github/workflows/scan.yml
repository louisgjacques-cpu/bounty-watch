name: bounty scan

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes, the fastest GitHub allows
    - cron: "0 12 1 * *"    # monthly keep-alive so GitHub doesn't pause the schedule
  workflow_dispatch:

permissions:
  issues: write
  contents: write

concurrency:
  group: bounty-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.schedule != '0 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 scan.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  keepalive:
    if: github.event.schedule == '0 12 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "bounty-watch"
          git config user.email "bounty-watch@users.noreply.github.com"
          git add .keepalive
          git commit -m "keep-alive" && git push
